# =====================================================================
# Cloudflare Worker & D1 Database Configuration (100% Cloudflare Stack)
# =====================================================================
# NO SECRETS IN REPOSITORY:
# Production secrets (e.g. JWT_SECRET) must be set via Cloudflare CLI or Dashboard:
#   npx wrangler secret put JWT_SECRET
#
# For local development with `wrangler dev`, copy `.dev.vars.example` to `.dev.vars`:
#   cp .dev.vars.example .dev.vars
# =====================================================================

name = "quotation-manager-api"
main = "worker/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------
# Cloudflare D1 Database Binding
# ---------------------------------------------------------------------
# Replace `database_id` with your Cloudflare D1 database ID generated from:
#   npx wrangler d1 create quotation-manager-db
# ---------------------------------------------------------------------
[[d1_databases]]
binding = "DB"                                      # Accessed in Worker as env.DB
database_name = "quotation-manager-db"              # D1 database name
database_id = "4b39a659-5317-452d-8fbd-afc639faccc8"   # <-- Set your D1 database ID here

# ---------------------------------------------------------------------
# Public Non-Sensitive Variables (NO SECRETS HERE)
# ---------------------------------------------------------------------
[vars]
CORS_ALLOW_ORIGIN = "*"
APP_NAME = "Quotation Manager SaaS"
