# =====================================================================
# Cloudflare Worker & D1 Database Configuration (100% Cloudflare Stack)
# =====================================================================
# NO SECRETS IN REPOSITORY:
# Production secrets must be set via Cloudflare CLI or Dashboard:
#   npx wrangler secret put JWT_SECRET
#   npx wrangler secret put TURNSTILE_SECRET
#
# For local testing, create a `.dev.vars` file (never commit to git):
#   JWT_SECRET="your-local-jwt-secret-key-32-chars-min"
#   TURNSTILE_SECRET="1x0000000000000000000000000000000AA"
# =====================================================================

name = "j-quotation-manager"
main = "worker/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------
# Static Assets (Frontend UI served directly by Worker)
# ---------------------------------------------------------------------
[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------
# Cloudflare D1 Database Binding
# ---------------------------------------------------------------------
[[d1_databases]]
binding = "Quotation_Manager"
database_name = "quotation-manager-db"
database_id = "4b39a659-5317-452d-8fbd-afc639faccc8"

# ---------------------------------------------------------------------
# Public Non-Sensitive Variables (NO SECRETS HERE)
# ---------------------------------------------------------------------
[vars]
CORS_ALLOW_ORIGIN = "*"
APP_NAME = "Quotation Manager SaaS"
