<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240">
  <defs>
    <linearGradient id="banBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Banner Background -->
  <rect width="1200" height="240" fill="url(#banBg)" rx="12"/>
  
  <!-- Subtle decorative roof corrugation lines in background -->
  <path d="M 0 60 Q 50 20 100 60 T 200 60 T 300 60 T 400 60 T 500 60 T 600 60 T 700 60 T 800 60 T 900 60 T 1000 60 T 1100 60 T 1200 60" 
        fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.15"/>
  <path d="M 0 180 Q 50 140 100 180 T 200 180 T 300 180 T 400 180 T 500 180 T 600 180 T 700 180 T 800 180 T 900 180 T 1000 180 T 1100 180 T 1200 180" 
        fill="none" stroke="#f97316" stroke-width="4" opacity="0.15"/>

  <!-- Left Product Badge -->
  <g transform="translate(40, 30)">
    <rect width="320" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="8" fill="url(#goldGrad)" rx="4"/>
    <text x="160" y="45" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">OUR PRODUCT RANGE</text>
    <text x="30" y="80" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#38bdf8">✔ PPGL Indradhanus Colour Coated</text>
    <text x="30" y="110" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#38bdf8">✔ Galvanized &amp; Bare Galvalume Sheets</text>
    <text x="30" y="140" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#38bdf8">✔ C &amp; Z Purlins / Decking Profiles</text>
    <text x="30" y="170" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#38bdf8">✔ Self Drilling Screws &amp; Ridge Caps</text>
  </g>

  <!-- Middle Center Text -->
  <g transform="translate(400, 45)">
    <text x="250" y="35" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      INDUSTRIAL SOLUTIONS
    </text>
    <text x="250" y="70" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#f97316" text-anchor="middle">
      TRUSTED LEADER IN INDUSTRIAL ROOFING SOLUTIONS
    </text>
    <text x="250" y="105" font-family="-apple-system, sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">
      High Tensile • Anti-Corrosive Coating • Superior Weather Resistance
    </text>
    <rect x="50" y="125" width="400" height="34" rx="17" fill="#f97316"/>
    <text x="250" y="148" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      FAST DELIVERY &amp; CUSTOM LENGTHS UP TO 40 FEET
    </text>
  </g>

  <!-- Right Contact / Quality Badge -->
  <g transform="translate(930, 30)">
    <rect width="230" height="180" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <circle cx="115" cy="55" r="30" fill="#f97316" opacity="0.2"/>
    <text x="115" y="62" font-family="-apple-system, sans-serif" font-size="28" fill="#f97316" text-anchor="middle">★</text>
    <text x="115" y="110" font-family="-apple-system, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">100% QUALITY</text>
    <text x="115" y="132" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">GUARANTEE</text>
    <text x="115" y="165" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">VERIFIED PARTNER</text>
  </g>
</svg>
