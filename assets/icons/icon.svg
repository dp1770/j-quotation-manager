<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Industrial Corrugated Profile Lines -->
  <path d="M 60 210 Q 110 150 160 210 T 260 210 T 360 210 T 452 210" 
        fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M 60 260 Q 110 200 160 260 T 260 260 T 360 260 T 452 260" 
        fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Document Card Icon -->
  <g transform="translate(156, 275)" filter="url(#shadow)">
    <rect width="200" height="160" rx="16" fill="#ffffff" />
    <rect x="24" y="32" width="152" height="16" rx="8" fill="#f97316" />
    <rect x="24" y="64" width="110" height="12" rx="6" fill="#94a3b8" />
    <rect x="24" y="90" width="136" height="12" rx="6" fill="#cbd5e1" />
    <rect x="24" y="116" width="80" height="12" rx="6" fill="#0284c7" />
  </g>

  <!-- Crown Monogram / Text -->
  <text x="256" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    JALARAM
  </text>
  <text x="256" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="20" font-weight="700" fill="#f97316" text-anchor="middle" letter-spacing="6">
    ENTERPRISE
  </text>
</svg>
